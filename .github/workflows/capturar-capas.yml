name: Capturar capas dos projetos

on:
  workflow_dispatch:
  push:
    paths:
      - 'docs/carrossel.html'
      - '.github/workflows/capturar-capas.yml'

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Playwright
        run: |
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Capturar capas
        run: |
          node <<'NODE'
          const fs = require('fs');
          const { chromium } = require('playwright');

          const html = fs.readFileSync('docs/carrossel.html', 'utf8');
          const urls = [...html.matchAll(/\['(?:Turma [123])','[^']+','[^']+','(?:B12|Base44)','[^']+','(https?:\/\/[^']+)'\]/g)]
            .map(m => m[1]);

          const unique = [...new Set(urls)];
          fs.mkdirSync('docs/assets/projetos', { recursive: true });

          const slug = u => u.replace(/^https?:\/\//,'').replace(/[^a-z0-9]+/gi,'-').replace(/^-|-$/g,'').toLowerCase();

          (async () => {
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage({ viewport:{width:1440,height:900}, deviceScaleFactor:1 });

            for (const url of unique) {
              const file = `docs/assets/projetos/${slug(url)}.jpg`;
              try {
                await page.goto(url, {waitUntil:'domcontentloaded', timeout:30000});
                await page.waitForTimeout(2500);
                await page.screenshot({path:file, type:'jpeg', quality:78});
                console.log('OK', url);
              } catch (e) {
                console.log('FALHA', url, e.message);
              }
            }
            await browser.close();
          })();
          NODE

      - name: Atualizar referências para JPG
        run: sed -i 's/\.png/\.jpg/g' docs/carrossel.html

      - name: Publicar capas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/projetos docs/carrossel.html
          git diff --cached --quiet || git commit -m "feat: adicionar capas visuais dos projetos"
          git push
