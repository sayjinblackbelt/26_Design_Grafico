<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><style>text{font-family:Arial,sans-serif;fill:#11181b}.h{font-size:42px;font-weight:bold}.t{font-size:22px}.n{font-size:28px;font-weight:bold;fill:#035aa6}.card{fill:#f7f9fb;stroke:#035aa6;stroke-width:2}</style><rect width="1200" height="675" fill="#fff"/><text x="60" y="70" class="h">Os 7 Princípios do Design Gráfico</text><text x="60" y="105" class="t">Organizar elementos para comunicar com clareza e intenção.</text><rect x="60" y="155" width="240" height="170" rx="18" class="card"/><text x="80" y="200" class="n">1. Contraste</text><text x="80" y="240" class="t">Destacar diferenças</text></g><rect x="340" y="155" width="240" height="170" rx="18" class="card"/><text x="360" y="200" class="n">2. Alinhamento</text><text x="360" y="240" class="t">Organizar em linhas</text></g><rect x="620" y="155" width="240" height="170" rx="18" class="card"/><text x="640" y="200" class="n">3. Proximidade</text><text x="640" y="240" class="t">Agrupar relações</text></g><rect x="900" y="155" width="240" height="170" rx="18" class="card"/><text x="920" y="200" class="n">4. Repetição</text><text x="920" y="240" class="t">Criar unidade</text></g><rect x="60" y="365" width="240" height="170" rx="18" class="card"/><text x="80" y="410" class="n">5. Hierarquia</text><text x="80" y="450" class="t">Mostrar prioridade</text></g><rect x="340" y="365" width="240" height="170" rx="18" class="card"/><text x="360" y="410" class="n">6. Espaço em branco</text><text x="360" y="450" class="t">Dar respiro</text></g><rect x="620" y="365" width="240" height="170" rx="18" class="card"/><text x="640" y="410" class="n">7. Equilíbrio</text><text x="640" y="450" class="t">Distribuir peso</text></g></svg>