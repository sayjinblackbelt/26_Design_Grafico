<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675"><style>text{font-family:Arial,sans-serif;fill:#11181b}.h{font-size:42px;font-weight:bold}.bad{font-size:32px;font-weight:bold;fill:#ad0626}.good{font-size:32px;font-weight:bold;fill:#16834a}.t{font-size:22px}</style><rect width="1200" height="675" fill="#fff"/><text x="60" y="70" class="h">Design Ruim × Bom Design</text><rect x="60" y="120" width="500" height="480" rx="20" fill="#fff4f4" stroke="#ad0626" stroke-width="3"/><text x="90" y="180" class="bad">❌ DESIGN RUIM</text><text x="90" y="235" class="t">• Muitas cores e fontes</text><text x="90" y="280" class="t">• Falta de alinhamento</text><text x="90" y="325" class="t">• Sem hierarquia</text><text x="90" y="370" class="t">• Informação espalhada</text><text x="90" y="415" class="t">• Leitura difícil</text><rect x="640" y="120" width="500" height="480" rx="20" fill="#f1fbf5" stroke="#16834a" stroke-width="3"/><text x="670" y="180" class="good">✓ BOM DESIGN</text><text x="670" y="235" class="t">• Paleta consistente</text><text x="670" y="280" class="t">• Alinhamento claro</text><text x="670" y="325" class="t">• Hierarquia visual</text><text x="670" y="370" class="t">• Espaço em branco</text><text x="670" y="415" class="t">• Comunicação eficiente</text></svg>