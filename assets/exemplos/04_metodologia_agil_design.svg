<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675"><style>text{font-family:Arial,sans-serif;fill:#11181b}.h{font-size:42px;font-weight:bold}.b{font-size:24px;font-weight:bold}.t{font-size:18px}.box{fill:#eef6fb;stroke:#035aa6;stroke-width:3}</style><rect width="1200" height="675" fill="#fff"/><text x="60" y="70" class="h">Metodologia Ágil aplicada ao Design</text><rect x="55" y="220" width="155" height="150" rx="20" class="box"/><text x="75" y="280" class="b">1. Briefing</text><text x="75" y="320" class="t">Objetivo e público</text><text x="215" y="300" font-size="42">→</text><rect x="245" y="220" width="155" height="150" rx="20" class="box"/><text x="265" y="280" class="b">2. Pesquisa</text><text x="265" y="320" class="t">Referências</text><text x="405" y="300" font-size="42">→</text><rect x="435" y="220" width="155" height="150" rx="20" class="box"/><text x="455" y="280" class="b">3. Ideação</text><text x="455" y="320" class="t">Alternativas</text><text x="595" y="300" font-size="42">→</text><rect x="625" y="220" width="155" height="150" rx="20" class="box"/><text x="645" y="280" class="b">4. Criação</text><text x="645" y="320" class="t">Produção</text><text x="785" y="300" font-size="42">→</text><rect x="815" y="220" width="155" height="150" rx="20" class="box"/><text x="835" y="280" class="b">5. Revisão</text><text x="835" y="320" class="t">Melhorias</text><text x="975" y="300" font-size="42">→</text><rect x="1005" y="220" width="155" height="150" rx="20" class="box"/><text x="1025" y="280" class="b">6. Entrega</text><text x="1025" y="320" class="t">Resultado</text><text x="60" y="500" class="b">Sprints: planejar → criar → revisar → melhorar → entregar</text><text x="60" y="545" class="t">O processo reduz retrabalho e valoriza a melhoria contínua.</text></svg>