<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#11181b"/><text x="80" y="82" fill="#ffce00" font-family="Arial,sans-serif" font-size="28" font-weight="700" letter-spacing="5">07 • ELEMENTOS GRÁFICOS</text><text x="80" y="135" fill="#fff" font-family="Arial,sans-serif" font-size="48" font-weight="900">Pequenas formas, grandes sinais.</text><g transform="translate(90 235)"><circle cx="150" cy="150" r="105" fill="#ff7c24"/><rect x="360" y="45" width="210" height="210" rx="35" fill="#035aa6"/><path d="M760 40l125 215H635Z" fill="#ffce00"/><rect x="1010" y="55" width="210" height="210" rx="35" fill="#d12353" transform="rotate(15 1115 160)"/><path d="M1320 150h180" stroke="#4a9ad1" stroke-width="18" stroke-linecap="round"/><path d="M1320 105h115M1320 195h140" stroke="#fff" stroke-width="8" stroke-linecap="round"/></g><g font-family="Arial,sans-serif"><text x="110" y="565" fill="#fff" font-size="24" font-weight="900">CÍRCULO</text><text x="445" y="565" fill="#fff" font-size="24" font-weight="900">QUADRADO</text><text x="700" y="565" fill="#fff" font-size="24" font-weight="900">TRIÂNGULO</text><text x="1055" y="565" fill="#fff" font-size="24" font-weight="900">ACENTO</text><text x="1340" y="565" fill="#fff" font-size="24" font-weight="900">LINHA</text></g><line x1="90" y1="640" x2="1510" y2="640" stroke="#4a9ad1" stroke-width="3"/><text x="90" y="710" fill="#dce3e5" font-family="Arial,sans-serif" font-size="23">Forma → repetição → ritmo → identidade → linguagem visual</text><text x="90" y="775" fill="#ff7c24" font-family="Arial,sans-serif" font-size="22" font-weight="900">ELEMENTOS DEVEM APOIAR A IDEIA, NÃO COMPETIR COM ELA.</text></svg>