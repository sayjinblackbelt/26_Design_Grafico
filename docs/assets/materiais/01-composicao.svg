<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560"><style>text{font-family:Arial,sans-serif}.title{font-size:28px;font-weight:700}.small{font-size:15px}.blue{fill:#035aa6}.orange{fill:#ff4d00}.red{fill:#d12353}.ink{fill:#1e1e1e}.muted{fill:#667177}</style><rect width="1000" height="560" fill="#fff"/><rect x="45" y="45" width="9" height="90" class="orange"/><text x="75" y="80" class="title blue">FUNDAMENTOS DO DESIGN</text><text x="75" y="112" class="small muted">7 princípios para organizar uma composição</text><g transform="translate(55 160)"><rect width="265" height="125" fill="#f1f2ef"/><text x="20" y="30" class="small muted">01 CONTRASTE</text><rect x="20" y="55" width="75" height="45" class="ink"/><rect x="110" y="70" width="130" height="15" class="orange"/></g><g transform="translate(365 160)"><rect width="265" height="125" fill="#f1f2ef"/><text x="20" y="30" class="small muted">02 ALINHAMENTO</text><line x1="20" y1="65" x2="225" y2="65" stroke="#035aa6" stroke-width="6"/><line x1="20" y1="90" x2="180" y2="90" stroke="#1e1e1e" stroke-width="5"/></g><g transform="translate(675 160)"><rect width="265" height="125" fill="#f1f2ef"/><text x="20" y="30" class="small muted">03 PROXIMIDADE</text><circle cx="65" cy="78" r="18" class="blue"/><circle cx="105" cy="78" r="18" class="blue"/><circle cx="190" cy="78" r="18" class="orange"/></g><g transform="translate(55 315)"><rect width="265" height="125" fill="#f1f2ef"/><text x="20" y="30" class="small muted">04 REPETIÇÃO</text><rect x="25" y="60" width="35" height="35" class="orange"/><rect x="80" y="60" width="35" height="35" class="orange"/><rect x="135" y="60" width="35" height="35" class="orange"/></g><g transform="translate(365 315)"><rect width="265" height="125" fill="#f1f2ef"/><text x="20" y="30" class="small muted">05 HIERARQUIA</text><text x="20" y="72" font-size="25" font-weight="700" class="orange">IMPORTANTE</text><text x="20" y="98" class="small ink">apoio • detalhe</text></g><g transform="translat