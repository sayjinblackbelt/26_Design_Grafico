<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560"><style>text{font-family:Arial,sans-serif}.title{font-size:28px;font-weight:700}.small{font-size:15px}.blue{fill:#035aa6}.orange{fill:#ff4d00}.red{fill:#d12353}.ink{fill:#1e1e1e}.muted{fill:#667177}</style><rect width="1000" height="560" fill="#fff"/><rect x="45" y="45" width="9" height="90" class="orange"/><text x="75" y="80" class="title blue">PALETA DE CORES</text><text x="75" y="112" class="small muted">Uma paleta funciona como sistema: principal, fundo, destaque e apoio.</text><g transform="translate(75 170)"><rect width="150" height="170" fill="#1e1e1e"/><text x="20" y="35" fill="#fff" class="small">PRINCIPAL</text><text x="20" y="145" fill="#fff" font-size="18">#1E1E1E</text></g><g transform="translate(245 170)"><rect width="150" height="170" fill="#fff" stroke="#ddd"/><text x="20" y="35" class="small ink">FUNDO</text><text x="20" y="145" class="small ink">#FFFFFF</text></g><g transform="translate(415 170)"><rect width="150" height="170" class="orange"/><text x="20" y="35" fill="#fff" class="small">DESTAQUE</text><text x="20" y="145" fill="#fff" font-size="18">#FF4D00</text></g><g transform="translate(585 170)"><rect width="150" height="170" fill="#FFD166"/><text x="20" y="35" class="small ink">APOIO 1</text><text x="20" y="145" class="small ink">#FFD166</text></g><g transform="translate(755 170)"><rect width="150" height="170" fill="#118AB2"/><text x="20" y="35" fill="#fff" class="small">APOIO 2</text><text x="20" y="145" fill="#fff" font-size="18">#118AB2</text></g><rect x="75" y="380" width="830" height="85" fill="#f1f2ef"/><text x="100" y="415" class="small ink">A paleta não é só “cores bonitas”. Cada cor recebe uma função.</text><text x="100" y="442" class="small muted">Use o Coolors para explorar combinações e registrar os códigos HEX.</text></svg>