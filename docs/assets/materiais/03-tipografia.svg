<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560"><rect width="1000" height="560" fill="#11181b"/><text x="55" y="55" font-family="Arial" font-size="24" font-weight="700" fill="#fff">TIPOGRAFIA • HIERARQUIA E LEGIBILIDADE</text><rect x="55" y="90" width="890" height="410" rx="20" fill="#fff"/><text x="95" y="175" font-family="Georgia" font-size="68" font-weight="700" fill="#11181b">Título principal</text><text x="98" y="220" font-family="Arial" font-size="25" font-weight="700" fill="#035aa6">Subtítulo que explica a ideia</text><text x="98" y="265" font-family="Arial" font-size="19" fill="#667177">Texto de corpo deve ser confortável para ler.</text><text x="98" y="295" font-family="Arial" font-size="19" fill="#667177">Tamanho, peso, espaçamento e largura interferem.</text><rect x="98" y="335" width="250" height="70" rx="10" fill="#ffce00"/><text x="120" y="380" font-family="Arial" font-size="24" font-weight="700" fill="#11181b">DESTAQUE</text><text x="410" y="355" font-family="Arial" font-size="15" fill="#667177">FUNÇÃO</text><text x="410" y="385" font-family="Arial" font-size="15" fill="#11181b">Título → peso + escala</text><text x="410" y="415" font-family="Arial" font-size="15" fill="#11181b">Subtítulo → contraste</text><text x="410" y="445" font-family="Arial" font-size="15" fill="#11181b">Corpo → legibilidade</text></svg>