<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560"><style>text{font-family:Arial,sans-serif}.title{font-size:28px;font-weight:700}.small{font-size:15px}.blue{fill:#035aa6}.orange{fill:#ff4d00}.red{fill:#d12353}.ink{fill:#1e1e1e}.muted{fill:#667177}</style><rect width="1000" height="560" fill="#fff"/><rect x="45" y="45" width="9" height="90" class="orange"/><text x="75" y="80" class="title blue">TIPOGRAFIA</text><text x="75" y="112" class="small muted">Fontes diferentes precisam ter funções diferentes.</text><rect x="65" y="160" width="500" height="285" fill="#f7f7f4" stroke="#ddd"/><text x="100" y="225" font-family="Georgia" font-size="54" class="ink">TÍTULO</text><text x="102" y="265" font-size="23" font-weight="700" class="muted">Subtítulo de Apoio</text><text x="102" y="310" class="small ink">O texto corrido deve ser fácil de ler.</text><text x="102" y="335" class="small ink">Use fontes simples para grandes blocos.</text><text x="102" y="390" font-size="28" font-style="italic" class="orange">Destaque Visual</text><rect x="600" y="160" width="300" height="285" class="blue"/><text x="630" y="205" fill="#fff" class="small">MINI-DESAFIO</text><text x="630" y="260" fill="#fff" font-size="26" font-weight="700">3 ou 4 fontes</text><text x="630" y="300" fill="#fff" font-size="20">Título</text><text x="630" y="335" fill="#fff" font-size="17">Subtítulo</text><text x="630" y="365" fill="#fff" font-size="15">Texto</text><text x="630" y="395" fill="#fff" font-size="14">Destaque</text><text x="65" y="495" class="small muted">A função da fonte é tão importante quanto sua aparência.</text></svg>