<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450"><rect width="800" height="450" fill="#fff"/><text x="60" y="100" font-family="Georgia" font-size="64" font-weight="700" fill="#11181b">Título</text><text x="63" y="145" font-family="Arial" font-size="25" fill="#035aa6">Subtítulo com contraste e escala</text><text x="63" y="205" font-family="Arial" font-size="20" fill="#667177">Texto de apoio organizado para facilitar a leitura.</text><text x="63" y="240" font-family="Arial" font-size="20" fill="#667177">Tamanho, peso, espaçamento e alinhamento criam hierarquia.</text><rect x="60" y="290" width="680" height="2" fill="#ff7c24"/><text x="60" y="340" font-family="Arial" font-size="18" font-weight="700" fill="#11181b">TÍTULO → SUBTÍTULO → CORPO → DESTAQUE</text></svg>