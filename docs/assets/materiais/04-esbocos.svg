<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560"><style>text{font-family:Arial,sans-serif}.title{font-size:28px;font-weight:700}.small{font-size:15px}.blue{fill:#035aa6}.orange{fill:#ff4d00}.red{fill:#d12353}.ink{fill:#1e1e1e}.muted{fill:#667177}</style><rect width="1000" height="560" fill="#fff"/><rect x="45" y="45" width="9" height="90" class="orange"/><text x="75" y="80" class="title blue">PROCESSO — ESBOÇOS E DECISÕES</text><text x="75" y="112" class="small muted">Apresente ideias, explore alternativas e registre decisões.</text><g transform="translate(65 165)"><rect width="250" height="235" fill="#f1f2ef" stroke="#cfd6da"/><text x="25" y="35" class="small muted">ESBOÇO 01</text><circle cx="125" cy="125" r="60" fill="none" stroke="#035aa6" stroke-width="10"/><path d="M85 170 L165 90 M165 170 L85 90" stroke="#ff4d00" stroke-width="8"/></g><g transform="translate(375 165)"><rect width="250" height="235" fill="#f1f2ef" stroke="#cfd6da"/><text x="25" y="35" class="small muted">ESBOÇO 02</text><rect x="65" y="85" width="120" height="80" fill="#118AB2"/><circle cx="125" cy="125" r="30" fill="#FFD166"/></g><g transform="translate(685 165)"><rect width="250" height="235" fill="#fff" stroke="#035aa6" stroke-width="3"/><text x="25" y="35" class="small blue">DECISÃO</text><text x="25" y="85" class="small ink">objetivo principal</text><text x="25" y="115" class="small ink">caminhos avaliados</text><text x="25" y="145" class="small ink">escolha feita</text><rect x="25" y="175" width="145" height="35" class="blue"/><text x="45" y="198" fill="#fff" class="small">APROVADO</text></g><text x="65" y="450" class="small muted">Esboçar antes de produzir permite comparar caminhos e justificar a escolha.</text></svg>