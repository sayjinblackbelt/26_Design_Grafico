<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560"><style>text{font-family:Arial,sans-serif}.title{font-size:28px;font-weight:700}.small{font-size:15px}.blue{fill:#035aa6}.orange{fill:#ff4d00}.red{fill:#d12353}.ink{fill:#1e1e1e}.muted{fill:#667177}</style><rect width="1000" height="560" fill="#fff"/><rect x="45" y="45" width="9" height="90" class="orange"/><text x="75" y="80" class="title blue">PROCESSO — PESQUISA E REFERÊNCIAS</text><text x="75" y="112" class="small muted">Pesquisa visual para orientar decisões de conceito, forma, cor e composição.</text><g transform="translate(65 160)"><rect width="250" height="170" fill="#1e1e1e"/><text x="25" y="40" fill="#fff" class="small">TIPOGRAFIA</text><text x="25" y="100" fill="#fff" font-family="Georgia" font-size="44">Aa</text><text x="25" y="145" fill="#fff" class="small">sistemas limpos</text></g><g transform="translate(375 160)"><rect width="250" height="170" fill="#035aa6"/><text x="25" y="40" fill="#fff" class="small">PALETA</text><rect x="25" y="70" width="55" height="65" class="orange"/><rect x="90" y="70" width="55" height="65" fill="#FFD166"/><rect x="155" y="70" width="55" height="65" fill="#fff"/></g><g transform="translate(685 160)"><rect width="250" height="170" fill="#f1f2ef"/><text x="25" y="40" class="small blue">DIAGRAMAÇÃO</text><rect x="25" y="70" width="200" height="12" class="ink"/><rect x="25" y="100" width="130" height="12" fill="#118AB2"/><rect x="25" y="130" width="170" height="12" fill="#ddd"/></g><text x="65" y="380" class="small blue">FONTES EXPLORADAS</text><text x="65" y="410" class="small muted">Tendências observadas • Direções aplicáveis • Elementos que inspiram</text><text x="65" y="465" class="small blue">PERGUNTA</text><text x="65" y="493" class="small ink">O que desta referência realmente serve ao meu projeto?</text></svg>