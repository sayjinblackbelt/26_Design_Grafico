<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560"><style>text{font-family:Arial,sans-serif}.title{font-size:28px;font-weight:700}.small{font-size:15px}.blue{fill:#035aa6}.orange{fill:#ff4d00}.red{fill:#d12353}.ink{fill:#1e1e1e}.muted{fill:#667177}</style><rect width="1000" height="560" fill="#fff"/><rect x="45" y="45" width="9" height="90" class="orange"/><text x="75" y="80" class="title blue">RESULTADO FINAL</text><text x="75" y="112" class="small muted">O resultado traduz o conceito em uma solução visual clara, coerente e pronta para uso.</text><rect x="65" y="165" width="360" height="245" fill="#f1f2ef"/><text x="95" y="210" class="small blue">FOCO</text><text x="95" y="238" class="small ink">Mensagem principal com impacto.</text><text x="95" y="285" class="small orange">COERÊNCIA</text><text x="95" y="313" class="small ink">Tipografia, cores e composição.</text><text x="95" y="360" class="small red">APLICAÇÃO</text><text x="95" y="388" class="small ink">Formatos prontos para mídias.</text><rect x="470" y="165" width="440" height="245" fill="#035aa6"/><rect x="505" y="195" width="180" height="150" fill="#fff"/><text x="525" y="235" class="small blue">MANUAL</text><text x="525" y="270" font-size="24" font-weight="700" class="blue">DA MARCA</text><rect x="720" y="215" width="130" height="70" fill="#fff"/><text x="740" y="255" class="small blue">CARTÃO</text><rect x="720" y="305" width="130" height="70" class="orange"/><text x="740" y="345" fill="#fff" class="small">APLICAÇÃO</text><text x="65" y="455" class="small muted">Identidade é sistema: tipografia + cor + composição + aplicações.</text></svg>