<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560"><style>text{font-family:Arial,sans-serif}.title{font-size:28px;font-weight:700}.small{font-size:15px}.blue{fill:#035aa6}.orange{fill:#ff4d00}.red{fill:#d12353}.ink{fill:#1e1e1e}.muted{fill:#667177}</style><rect width="1000" height="560" fill="#fff"/><rect x="45" y="45" width="9" height="90" class="orange"/><text x="75" y="80" class="title blue">FICHA DE PROJETO</text><text x="75" y="112" class="small muted">Modelo para ficha técnica e resumo do projeto.</text><g transform="translate(65 165)"><rect width="390" height="110" fill="#f1f2ef"/><text x="25" y="35" class="small blue">OBJETIVO</text><text x="25" y="65" class="small ink">propósito e impacto esperado</text></g><g transform="translate(475 165)"><rect width="390" height="110" fill="#f1f2ef"/><text x="25" y="35" class="small orange">FERRAMENTAS</text><text x="25" y="65" class="small ink">softwares e recursos utilizados</text></g><g transform="translate(65 300)"><rect width="390" height="110" fill="#f1f2ef"/><text x="25" y="35" class="small blue">EQUIPE</text><text x="25" y="65" class="small ink">papéis e responsáveis</text></g><g transform="translate(475 300)"><rect width="390" height="110" fill="#f1f2ef"/><text x="25" y="35" class="small red">DATA</text><text x="25" y="65" class="small ink">execução e etapas-chave</text></g><text x="65" y="465" class="small muted">Margens consistentes + respiro entre módulos = leitura clara e adaptação.</text></svg>