<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><rect width="1200" height="630" fill="#f2f7fa"/><text x="80" y="105" fill="#035aa6" font-family="Arial,sans-serif" font-size="28" font-weight="700">05 · PROCESSO / BASTIDORES</text><text x="80" y="175" fill="#11181b" font-family="Arial,sans-serif" font-size="56" font-weight="700">Antes do resultado, existe o processo.</text><g transform="translate(90 260)"><circle cx="55" cy="55" r="35" fill="#ff7c24"/><text x="45" y="65" fill="white" font-family="Arial" font-size="24">01</text><line x1="90" y1="55" x2="260" y2="55" stroke="#4a9ad1" stroke-width="8"/><circle cx="300" cy="55" r="35" fill="#ffce00"/><text x="290" y="65" fill="#11181b" font-family="Arial" font-size="24">02</text><line x1="335" y1="55" x2="505" y2="55" stroke="#4a9ad1" stroke-width="8"/><circle cx="545" cy="55" r="35" fill="#035aa6"/><text x="535" y="65" fill="white" font-family="Arial" font-size="24">03</text><line x1="580" y1="55" x2="750" y2="55" stroke="#4a9ad1" stroke-width="8"/><circle cx="790" cy="55" r="35" fill="#d12353"/><text x="780" y="65" fill="white" font-family="Arial" font-size="24">04</text></g><text x="90" y="400" fill="#11181b" font-family="Arial,sans-serif" font-size="30">Problema → Pesquisa → Esboço → Moodboard → Conceito → Planejamento</text><text x="90" y="455" fill="#4a9ad1" font-family="Arial,sans-serif" font-size="30">Produção → Teste → Revisão → Resultado → Reflexão → Portfólio</text></svg>