<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Carrossel público de projetos de Design Gráfico."><title>Projetos em Carrossel | Design Gráfico</title><link rel="stylesheet" href="style.css"><style>.carousel-page{min-height:100vh;padding:38px 0 55px}.back{display:inline-block;color:var(--blue);font-weight:800;text-decoration:none;margin-bottom:25px}.carousel-head h1{font-size:clamp(2.5rem,6vw,5rem);margin:8px 0 10px;letter-spacing:-.05em}.carousel-head p{max-width:700px}.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}.filters select,.filters input{padding:11px 13px;border:1px solid var(--line);border-radius:12px;background:#fff;font:inherit}.viewer{background:var(--ink);border-radius:24px;padding:18px;box-shadow:0 20px 50px rgba(17,24,27,.15)}.viewer-top{display:flex;justify-content:space-between;color:#fff;padding:3px 5px 15px}.frame-wrap{background:#fff;border-radius:16px;overflow:hidden;aspect-ratio:16/10;display:flex;align-items:center;justify-content:center}.frame-wrap img{width:100%;height:100%;object-fit:cover;display:block}.image-fallback{display:flex;align-items:center;justify-content:center;width:100%;height:100%;padding:30px;text-align:center;background:#f2f4f5;color:var(--ink);font-weight:800}.controls-row{display:flex;justify-content:center;gap:12px;margin-top:16px}.nav{border:0;border-radius:50%;width:48px;height:48px;font-size:1.3rem;cursor:pointer;background:#fff;color:var(--ink)}.nav:hover{background:var(--yellow)}.caption{padding:18px 5px 3px;color:#fff}.caption h2{font-size:1.6rem;margin:0 0 4px;color:#fff}.caption p{margin:0;color:#d9dfe2}.open{display:inline-block;margin-top:12px;color:var(--yellow);font-weight:800;text-decoration:none}.empty{padding:40px;text-align:center}</style></head>
<body><main class="carousel-page wrap"><a class="back" href="index.html">← Voltar ao portfólio</a><div class="carousel-head"><span class="eyebrow">PORTFÓLIO PÚBLICO</span><h1>Projetos em carrossel</h1><p>Explore os trabalhos publicados por turma, plataforma e primeiro nome.</p></div><div class="filters"><select id="classFilter"><option value="all">Todas as turmas</option><option>Turma 1</option><option>Turma 2</option><option>Turma 3</option></select><select id="platformFilter"><option value="all">Todas as plataformas</option><option>B12</option><option>Base44</option><option>InstaPlay</option></select><input id="search" placeholder="Buscar projeto ou educando"></div><section id="app"><div class="empty">Carregando projetos...</div></section></main>
<script>
let projects=[],list=[],pos=0;
const search=document.getElementById('search'),classFilter=document.getElementById('classFilter'),platformFilter=document.getElementById('platformFilter');
async function loadProjects(){
  try{
    const html=await fetch('index.html').then(r=>r.text());
    const match=html.match(/const projects=(\[.*?\]);/s);
    if(!match) throw new Error('Dados do portfólio não encontrados');
    projects=Function('return '+match[1])();
    render();
  }catch(error){document.getElementById('app').innerHTML='<div class="empty">Não foi possível carregar os projetos. <a href="index.html">Voltar ao portfólio</a></div>';}
}
function render(){const q=search.value.toLowerCase().trim(),cl=classFilter.value,pl=platformFilter.value;list=projects.filter(([c,n,p,x])=>(cl==='all'||c===cl)&&(pl==='all'||x===pl)&&(!q||`${n} ${p} ${x}`.toLowerCase().includes(q)));pos=0;show()}
function slug(u){return u.replace(/^https?:\/\//,'').replace(/[^a-z0-9]+/gi,'-').replace(/^-|-$/g,'').toLowerCase()}
function show(){const el=document.getElementById('app');if(!list.length){el.innerHTML='<div class="empty">Nenhum projeto encontrado.</div>';return}const[c,n,p,pl,d,u]=list[pos];el.innerHTML=`<div class="viewer"><div class="viewer-top"><span>${c} • ${pl}</span><span>${pos+1} / ${list.length}</span></div><div class="frame-wrap"><img src="assets/projetos/${slug(u)}.jpg" alt="Prévia do projeto ${p}" loading="eager" onerror="this.style.display='none';this.parentElement.innerHTML='<div class="image-fallback">Prévia visual em preparação<br><small>Use o botão abaixo para visitar o projeto.</small></div>'"></div><div class="controls-row"><button class="nav" onclick="move(-1)" aria-label="Projeto anterior">←</button><button class="nav" onclick="move(1)" aria-label="Próximo projeto">→</button></div><div class="caption"><h2>${p}</h2><p>Projeto de <strong>${n}</strong> • criado em ${d}</p><a class="open" href="${u}" target="_blank" rel="noopener">Abrir em nova aba ↗</a></div></div>`}
function move(d){pos=(pos+d+list.length)%list.length;show()}
[classFilter,platformFilter,search].forEach(x=>x.addEventListener('input',render));
loadProjects();
</script></body></html>
