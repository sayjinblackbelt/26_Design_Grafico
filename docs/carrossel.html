<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Carrossel de projetos digitais do portfólio de Design Gráfico.">
<title>Projetos em Carrossel | Design Gráfico</title>
<link rel="stylesheet" href="style.css">
<style>
body{background:var(--paper)}.carousel-page{min-height:100vh;padding:38px 0 55px}.back{display:inline-block;color:var(--blue);font-weight:800;text-decoration:none;margin-bottom:25px}.carousel-head{display:flex;justify-content:space-between;gap:25px;align-items:end;margin-bottom:25px}.carousel-head h1{font-size:clamp(2.5rem,6vw,5rem);margin:8px 0 10px;letter-spacing:-.05em}.carousel-head p{max-width:650px}.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}.filters select,.filters input{padding:11px 13px;border:1px solid var(--line);border-radius:12px;background:#fff;font:inherit}.viewer{background:var(--ink);border-radius:24px;padding:18px;box-shadow:0 20px 50px rgba(17,24,27,.15)}.viewer-top{display:flex;justify-content:space-between;align-items:center;color:#fff;padding:3px 5px 15px}.counter{font-weight:800}.frame-wrap{background:#fff;border-radius:16px;overflow:hidden;aspect-ratio:16/10}.frame-wrap iframe{width:100%;height:100%;border:0}.blocked{display:none;height:100%;align-items:center;justify-content:center;text-align:center;padding:30px}.blocked div{max-width:520px}.blocked a{display:inline-block;margin-top:12px;background:var(--blue);color:#fff;padding:12px 17px;border-radius:999px;text-decoration:none;font-weight:800}.controls-row{display:flex;justify-content:center;gap:12px;margin-top:16px}.nav{border:0;border-radius:50%;width:48px;height:48px;font-size:1.3rem;cursor:pointer;background:#fff;color:var(--ink)}.nav:hover{background:var(--yellow)}.caption{padding:18px 5px 3px;color:#fff}.caption h2{font-size:1.6rem;margin:0 0 4px;color:#fff}.caption p{margin:0;color:#d9dfe2}.open{display:inline-block;margin-top:12px;color:var(--yellow);font-weight:800;text-decoration:none}.empty{padding:40px;text-align:center}@media(max-width:650px){.carousel-head{display:block}.frame-wrap{aspect-ratio:4/5}}
</style>
</head>
<body>
<main class="carousel-page wrap">
<a class="back" href="index.html">← Voltar ao portfólio</a>
<div class="carousel-head"><div><span class="eyebrow">PORTFÓLIO DIGITAL</span><h1>Projetos em carrossel</h1><p>Explore uma experiência por vez. Use os filtros para navegar por turma e plataforma.</p></div></div>
<div class="filters"><select id="classFilter"><option value="all">Todas as turmas</option><option>Turma 1</option><option>Turma 2</option><option>Turma 3</option></select><select id="platformFilter"><option value="all">Todas as plataformas</option><option>B12</option><option>Base44</option></select><input id="search" placeholder="Buscar projeto ou educando"></div>
<section id="app"></section>
</main>
<script>
const projects=[];
async function load(){const r=await fetch('index.html');const t=await r.text();const m=t.match(/const projects = \[(.*?)\n\];/s);if(!m)return;const raw='['+m[1]+']';const fn=new Function('return '+raw);window.projects=fn();render()}
function render(){const q=search.value.toLowerCase().trim(),cl=classFilter.value,pl=platformFilter.value;const list=projects.filter(([c,n,p,x])=>(cl==='all'||c===cl)&&(pl==='all'||x===pl)&&(!q||`${n} ${p} ${x}`.toLowerCase().includes(q)));window.list=list;window.pos=Math.min(window.pos||0,Math.max(0,list.length-1));const el=document.getElementById('app');if(!list.length){el.innerHTML='<div class="empty">Nenhum projeto encontrado.</div>';return}show()}
function show(){const [c,n,p,pl,date,url]=list[pos];document.getElementById('app').innerHTML=`<div class="viewer"><div class="viewer-top"><span>${c} • ${pl}</span><span class="counter">${pos+1} / ${list.length}</span></div><div class="frame-wrap"><iframe src="${url}" title="${p}" loading="eager"></iframe><div class="blocked"><div><h2>Visualização externa</h2><p>O site não permite incorporação neste carrossel.</p><a href="${url}" target="_blank" rel="noopener">Abrir projeto ↗</a></div></div></div><div class="controls-row"><button class="nav" onclick="move(-1)" aria-label="Projeto anterior">←</button><button class="nav" onclick="move(1)" aria-label="Próximo projeto">→</button></div><div class="caption"><h2>${p}</h2><p>Projeto de <strong>${n}</strong> • criado em ${date}</p><a class="open" href="${url}" target="_blank" rel="noopener">Abrir em nova aba ↗</a></div></div>`}
function move(d){pos=(pos+d+list.length)%list.length;show()}
[classFilter,platformFilter,search].forEach(x=>x.addEventListener('input',()=>{pos=0;render()}));load();
</script>
</body></html>
