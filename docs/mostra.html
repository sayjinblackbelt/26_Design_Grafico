<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Apresentação pública de produtos digitais do curso PMT — Design Gráfico 2026."><title>Mostra | Design Gráfico 2026</title><link rel="stylesheet" href="style.css"><style>body{background:#05090b;color:#fff;overflow:hidden}.show{height:100vh;display:grid;grid-template-rows:auto 1fr auto;padding:18px 24px}.showbar{display:flex;justify-content:space-between;align-items:center;gap:20px}.showbar a{color:var(--yellow);text-decoration:none;font-weight:800}.stage{display:flex;align-items:center;justify-content:center;min-height:0}.viewer{width:min(1500px,96vw);height:min(82vh,900px);background:#11181b;border:1px solid #2c363b;border-radius:22px;padding:12px;display:grid;grid-template-rows:1fr auto;box-shadow:0 25px 80px rgba(0,0,0,.45)}.screen{background:#fff;border-radius:14px;overflow:hidden;position:relative}.screen img{width:100%;height:100%;object-fit:cover}.fallback{height:100%;display:grid;place-items:center;text-align:center;background:#eef1f2;color:#11181b;font-size:clamp(1rem,2vw,1.5rem);font-weight:800}.caption{display:flex;justify-content:space-between;align-items:end;gap:20px;padding:12px 4px 3px}.caption h1{font-size:clamp(1.2rem,2.5vw,2.1rem);line-height:1;margin:0 0 4px;color:#fff}.caption p{margin:0;color:#aeb9be}.caption a{color:var(--yellow);font-weight:800;text-decoration:none;white-space:nowrap}.controls{position:fixed;left:0;right:0;top:50%;display:flex;justify-content:space-between;pointer-events:none;padding:0 8px}.nav{pointer-events:auto;border:0;border-radius:50%;width:54px;height:54px;font-size:1.35rem;cursor:pointer;background:rgba(255,255,255,.9);color:#11181b}.nav:hover{background:var(--yellow)}.progress{text-align:center;color:#849197;font-size:.82rem;padding-top:4px}@media(max-width:700px){.show{padding:12px}.viewer{height:78vh}.caption{display:block}.caption a{display:inline-block;margin-top:6px}.controls{padding:0 2px}.nav{width:46px;height:46px}.showbar .eyebrow{font-size:.62rem}}</style></head>
<body><main class="show"><header class="showbar"><span class="eyebrow">MOSTRA • PRODUTOS DIGITAIS • 2026</span><a href="portfolio.html">Voltar ao portfólio ↗</a></header><section class="stage"><div class="viewer"><div class="screen" id="screen"></div><div class="caption"><div><h1 id="title"></h1><p id="meta"></p></div><a id="open" href="#" target="_blank" rel="noopener noreferrer">Abrir projeto ↗</a></div></div></section><div class="progress" id="progress"></div><div class="controls"><button class="nav" id="prev" aria-label="Anterior">←</button><button class="nav" id="next" aria-label="Próximo">→</button></div></main>
<script>
let projects=[],pos=0;const slug=u=>u.replace(/^https?:\/\//,'').replace(/[^a-z0-9]+/gi,'-').replace(/^-|-$/g,'').toLowerCase();async function load(){const html=await fetch('portfolio.html').then(r=>r.text());const m=html.match(/const projects=(\[.*?\]);/s);projects=Function('return '+m[1])();show()}function show(){const[p,pl,d,u]=projects[pos];document.getElementById('screen').innerHTML=`<img src="assets/projetos/${slug(u)}.jpg" alt="Prévia de ${p}" onerror="this.style.display='none';this.parentElement.innerHTML='<div class=\"fallback\">Prévia visual em preparação<br><small>O projeto continua disponível pelo botão abaixo.</small></div>'>`;document.getElementById('title').textContent=p;document.getElementById('meta').textContent=`${pl} • ${d}`;document.getElementById('open').href=u;document.getElementById('progress').textContent=`${pos+1} / ${projects.length}`;document.title=`${p} | Mostra`}function move(d){pos=(pos+d+projects.length)%projects.length;show()}document.getElementById('prev').onclick=()=>move(-1);document.getElementById('next').onclick=()=>move(1);document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1);if(e.key==='Escape')location.href='portfolio.html'});load();
</script></body></html>
